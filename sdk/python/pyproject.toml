[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ownagent-sdk"
version = "0.1.0"
description = "Python SDK for the OwnAgent Action Runtime"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OwnAgent Contributors" }]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.5,<1"]
otel-json = [
  "opentelemetry-sdk>=1.45,<2",
  "opentelemetry-exporter-otlp-json-http>=1.45,<2",
]
openinference-openai = ["openinference-instrumentation-openai>=0.1"]
openinference-langchain = ["openinference-instrumentation-langchain>=0.1"]
openinference-openai-agents = ["openinference-instrumentation-openai-agents>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/ownagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
# Keep Python 3.10 support without adding typing_extensions solely for Self.
ignore = ["PYI034"]
target-version = "py310"
