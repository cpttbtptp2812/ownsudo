name: Maven Verify

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: maven-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compile and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify
        run: mvn --batch-mode --no-transfer-progress verify
