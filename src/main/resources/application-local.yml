spring:
  datasource:
    url: jdbc:h2:file:./data/agent_db;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER;DEFAULT_LOCK_TIMEOUT=5000
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  servlet:
    encoding:
      charset: UTF-8
      force: true
      force-request: true
      force-response: true