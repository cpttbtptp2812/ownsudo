spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  datasource:
    url: jdbc:mysql://${DB_HOST:agent-mysql}:${DB_PORT:3306}/${DB_NAME:agent_db}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  security:
    approver-api-key: ${OWNAGENT_APPROVER_API_KEY}
    approver-id: ${OWNAGENT_APPROVER_ID}
    tool-admin-api-key: ${OWNAGENT_TOOL_ADMIN_API_KEY}
    bootstrap-agent-id: ${OWNAGENT_BOOTSTRAP_AGENT_ID:}
    bootstrap-agent-api-key: ${OWNAGENT_BOOTSTRAP_AGENT_API_KEY:}

