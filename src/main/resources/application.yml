server:
  port: 8080

spring:
  application:
    name: ownsudo-engine
  flyway:
    enabled: false
  profiles:
    active: local

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.ownsudo: DEBUG
    org.hibernate.SQL: WARN
app:
  security:
    approver-api-key: ${OWNAGENT_APPROVER_API_KEY:}
    approver-id: ${OWNAGENT_APPROVER_ID:}
    bootstrap-agent-id: ${OWNAGENT_BOOTSTRAP_AGENT_ID:}
    bootstrap-agent-api-key: ${OWNAGENT_BOOTSTRAP_AGENT_API_KEY:}
