server:
  port: 8080

spring:
  application:
    name: ownsudo-engine
  flyway:
    enabled: false
  profiles:
    active: local

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.ownsudo: DEBUG
    org.hibernate.SQL: WARN

ownagent:
  trace:
    capture-content: ${OWNAGENT_TRACE_CAPTURE_CONTENT:false}
  runtime:
    lease-seconds: ${OWNAGENT_ACTION_LEASE_SECONDS:300}
    heartbeat-interval-ms: ${OWNAGENT_ACTION_HEARTBEAT_INTERVAL_MS:10000}
    handler-timeout-seconds: ${OWNAGENT_ACTION_TIMEOUT_SECONDS:60}
    recovery-interval-ms: ${OWNAGENT_ACTION_RECOVERY_INTERVAL_MS:30000}

app:
  security:
    approver-api-key: ${OWNAGENT_APPROVER_API_KEY:}
    approver-id: ${OWNAGENT_APPROVER_ID:}
    tool-admin-api-key: ${OWNAGENT_TOOL_ADMIN_API_KEY:}
    bootstrap-agent-id: ${OWNAGENT_BOOTSTRAP_AGENT_ID:}
    bootstrap-agent-api-key: ${OWNAGENT_BOOTSTRAP_AGENT_API_KEY:}
